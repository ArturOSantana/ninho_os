name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  ci:
    name: Typecheck + Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript — check
        run: npx tsc --noEmit

      - name: Tests
        run: npx jest --passWithNoTests --forceExit
        env:
          # Expo / React Native precisa de variável de ambiente para builds em CI
          CI: true
          # Stubs — os testes mockam o Supabase internamente, mas a lib
          # ainda resolve o módulo e pode reclamar de ausência de URL/KEY.
          EXPO_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: placeholder_anon_key
