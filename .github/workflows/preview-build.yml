name: CI/CD - EAS Preview Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Typecheck & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Dependências
        run: npm ci

      - name: Rodar Verificação de Tipos (TypeScript)
        run: npx tsc --noEmit

      - name: Executar Testes Automatizados (Jest)
        run: npx jest --passWithNoTests --forceExit
        env:
          CI: true
          EXPO_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: placeholder_anon_key

  eas-build:
    name: Build Nativo (EAS Preview)
    needs: test # Só inicia se o job 'test' passar com sucesso
    if: github.event_name == 'push' # Roda apenas em pushes diretos na branch principal (não em PRs)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Dependências
        run: npm ci

      - name: Configurar EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Compilar Build de Preview (Android APK)
        run: eas build --platform android --profile preview --non-interactive
